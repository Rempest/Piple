controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:

    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint

    wheel_separation: 0.38
    wheel_radius: 0.0795

    base_frame_id: base_footprint
    odom_frame_id: odom

    publish_rate: 50.0
    use_stamped_vel: true
    enable_odom_tf: true

    cmd_vel_timeout: 1.0
    publish_limited_velocity: true
    preserve_turning_radius: false

    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 4.0
    linear.x.min_velocity: -4.0
    linear.x.max_acceleration: 3.0
    linear.x.min_acceleration: -3.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 2.2
    angular.z.min_velocity: -2.2
    angular.z.max_acceleration: 4.0
    angular.z.min_acceleration: -4.0